<div class="detalhe-container">
  @if (carregando()) {
    <p>Carregando...</p>
  } @else {
    <h1>Editar Transação</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" formControlName="descricao" />
      </div>

      <div class="campo">
        <label for="valor">Valor</label>
        <input id="valor" type="number" step="0.01" formControlName="valor" />
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <input id="categoria" type="text" formControlName="categoria" />
      </div>

      <div class="campo">
        <label for="data">Data</label>
        <input id="data" type="date" formControlName="data" />
      </div>

      <div class="campo">
        <label for="tipo">Tipo</label>
        <select id="tipo" formControlName="tipo">
          @for (item of tiposTransacao; track item.valor) {
            <option [value]="item.valor">{{ item.nome }}</option>
          }
        </select>
      </div>

      @if (form.value.tipo === 0) {
        <div class="campo">
          <label for="formaPagamento">Forma de pagamento</label>
          <select id="formaPagamento" formControlName="formaPagamento">
            @for (item of formasPagamento; track item.valor) {
              <option [value]="item.valor">{{ item.nome }}</option>
            }
          </select>
        </div>
      }

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <div class="acoes">
        <a routerLink="/transacoes" class="botao-cancelar">Cancelar</a>
        <button type="submit" [disabled]="form.invalid">Salvar</button>
      </div>
    </form>
  }
</div>
