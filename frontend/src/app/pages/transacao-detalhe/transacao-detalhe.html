<div class="detalhe-container">
  @if (carregando()) {
    <p>Carregando...</p>
  } @else {
    <h1>Editar Transação</h1>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo">
        <label for="descricao">Descrição</label>
        <input id="descricao" type="text" formControlName="descricao" />
      </div>

      <div class="campo">
        <label for="valor">Valor</label>
        <input id="valor" type="number" step="0.01" formControlName="valor" />
      </div>

      <div class="campo">
        <label>Moeda</label>
        <app-select formControlName="moeda" [opcoes]="moedas" placeholder="Selecione a moeda" />
      </div>

      <div class="campo">
        <label for="categoria">Categoria</label>
        <input id="categoria" type="text" formControlName="categoria" />
      </div>

      <div class="campo">
        <label>Data</label>
        <app-datepicker formControlName="data" />
      </div>

      <div class="campo">
        <label>Tipo</label>
        <app-select formControlName="tipo" [opcoes]="tiposTransacao" placeholder="Selecione o tipo" />
      </div>

      @if (form.value.tipo === 0) {
        <div class="campo">
          <label>Forma de pagamento</label>
          <app-select formControlName="formaPagamento" [opcoes]="formasPagamento" placeholder="Selecione a forma de pagamento" />
        </div>
      }

      @if (erro()) {
        <p class="erro">{{ erro() }}</p>
      }

      <div class="acoes">
        <a routerLink="/transacoes" class="botao-cancelar">Cancelar</a>
        <button type="submit" [disabled]="form.invalid">Salvar</button>
      </div>
    </form>
  }
</div>
