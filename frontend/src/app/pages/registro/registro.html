<div class="registro-container">
  <h1>Criar conta</h1>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="campo">
      <label for="nome">Nome</label>
      <input id="nome" type="text" formControlName="nome" />
    </div>

    <div class="campo">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" />
    </div>

    <div class="campo">
      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input id="senha" [type]="mostrarSenha() ? 'text' : 'password'" formControlName="senha" />
        <button
          type="button"
          class="botao-senha"
          [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
          (click)="alternarSenha()"
        >
          @if (mostrarSenha()) {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z" />
              <circle cx="12" cy="12" r="2.5" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m3 3 18 18M10.6 6.2A10.8 10.8 0 0 1 12 6c6.5 0 10 6 10 6a18.3 18.3 0 0 1-3.2 3.8M6.2 6.8C3.5 8.5 2 12 2 12s3.5 6 10 6c1 0 1.9-.1 2.8-.4" />
            </svg>
          }
        </button>
      </div>
    </div>

    <p class="erro" *ngIf="erro">{{ erro }}</p>

    <button type="submit" [disabled]="form.invalid">Registrar</button>
  </form>

  <p>Já tem conta? <a routerLink="/login">Entrar</a></p>
</div>
